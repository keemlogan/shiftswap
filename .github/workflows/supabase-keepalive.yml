# Keeps the free Supabase project behind the hub's document history active. The free plan pauses a project after
# seven days of low activity; the Supabase docs state that a few requests to the database each day prevent that.
# GitHub disables scheduled workflows in a public repository after 60 days without repository activity.
name: Supabase keep-alive

on:
  schedule:
    - cron: "23 */6 * * *"   # every six hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the document heads
        env:
          SUPABASE_URL: https://dbahxuegxnqsthntpuqy.supabase.co
          SUPABASE_KEY: sb_publishable_Efbr07Evn3lAJUKUqmZWmg_EvWp5DkY   # publishable key, public by design (also in hub/collab-config.js)
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/doc_heads?select=doc,main_count" \
            -H "apikey: $SUPABASE_KEY"
