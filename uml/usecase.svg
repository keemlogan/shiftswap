roke-width:0.5;"/><path d="M207.68,162.5 L207.68,189.5 M194.68,170.5 L220.68,170.5 M207.68,189.5 L194.68,204.5 M207.68,189.5 L220.68,204.5" style="stroke:#1C2230;stroke-width:0.5;" fill="none"/><text x="162" y="215.24" fill="#000" font-size="12" textLength="91.359" font-family="'Helvetica'">A3 System Clock</text></g><!--entity A2--><g class="entity" data-qualified-name="A2" id="ent0020" data-source-line="67"><ellipse cx="207.678" cy="636.5" rx="8" ry="8" fill="#FFF" style="stroke:#1C2230;stroke-width:0.5;"/><path d="M207.678,644.5 L207.678,671.5 M194.678,652.5 L220.678,652.5 M207.678,671.5 L194.678,686.5 M207.678,671.5 L220.678,686.5" style="stroke:#1C2230;stroke-width:0.5;" fill="none"/><text x="181" y="697.24" fill="#000" font-size="12" textLength="53.355" font-family="'Helvetica'">A2 Owner</text></g><g class="entity" data-qualified-name="N1" id="ent0037" data-source-line="91"><path d="M530,891 L530,1009 L891.16,1009 L891.16,901 L881.16,891 L530,891" style="stroke:#1C2230;stroke-width:0.5;" fill="#FFFEF2"/><path d="M881.16,891 L881.16,901 L891.16,901 L881.16,891" style="stroke:#1C2230;stroke-width:1;" fill="#FFFEF2"/><text x="536" y="905.24" fill="#000" font-size="12" textLength="239.795" font-family="'Helvetica'">Amber border = substitution-related use case</text><text x="536" y="917.24" fill="#000" font-size="12" textLength="193.424" font-family="'Helvetica'">(detail in Figure usecase-substitute).</text><text x="536" y="929.24" fill="#000" font-size="12" textLength="304.816" font-family="'Helvetica'">All use cases except UC-11 and UC-14 «include» UC-13.</text><text x="536" y="941.24" fill="#000" font-size="12" textLength="322.775" font-family="'Helvetica'">UC-14 also notifies A2 Owner (PAYROLL_DRAFT_READY);</text><text x="536" y="953.24" fill="#000" font-size="12" textLength="226.066" font-family="'Helvetica'">the owner still reviews/confirms via UC-09.</text><text x="536" y="965.24" fill="#000" font-size="12" textLength="290.115" font-family="'Helvetica'">UC-02 (Register availability) retired in iteration 6 (§15).</text><text x="536" y="977.24" fill="#000" font-size="12" textLength="317.537" font-family="'Helvetica'">A3 uses the demo clock in the local mode and the database</text><text x="536" y="989.24" fill="#000" font-size="12" textLength="340.16" font-family="'Helvetica'">server time in the shared mode (§9); UC-11 and UC-14 are then</text><text x="536" y="1001.24" fill="#000" font-size="12" textLength="182.098" font-family="'Helvetica'">saved by whichever client is open.</text></g><!--entity UC04--><g class="entity" data-qualified-name="Boundary.UC04" id="ent0007" data-source-line="46"><ellipse cx="391.539" cy="244.222" rx="66.039" ry="18.222" fill="#FFF" style="stroke:#E9A23B;stroke-width:0.5;"/><text x="374.201" y="238.087" fill="#1C2230" font-size="12" textLength="34.676" font-family="'Helvetica'">UC-04</text><text x="341.843" y="250.087" fill="#1C2230" font-size="12" textLength="99.393" font-family="'Helvetica'">Request substitute</text></g><!--entity UC05--><g class="entity" data-qualified-name="Boundary.UC05" id="ent0008" data-source-line="47"><ellipse cx="391.714" cy="299.143" rx="81.214" ry="18.643" fill="#FFF" style="stroke:#E9A23B;stroke-width:0.5;"/><text x="374.376" y="292.389" fill="#1C2230" font-size="12" textLength="34.676" font-family="'Helvetica'">UC-05</text><text x="326.868" y="304.389" fill="#1C2230" font-size="12" textLength="129.691" font-family="'Helvetica'">Respond (accept / can't)</text></g><!--entity UC12--><g class="entity" data-qualified-name="Boundary.UC12" id="ent0009" data-source-line="48"><ellipse cx="391.667" cy="361.867" rx="63.167" ry="25.867" fill="#FFF" style="stroke:#E9A23B;stroke-width:0.5;"/><text x="374.329" y="348.47" fill="#1C2230" font-size="12" textLength="34.676" font-family="'Helvetica'">UC-12</text><text x="360.317" y="360.47" fill="#1C2230" font-size="12" textLength="62.701" font-family="'Helvetica'">Cancel own</text><text x="344.306" y="372.47" fill="#1C2230" font-size