.7402">[row has minWageWarning] / acknowledgeMinWage(yearMonth, workerId)</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="154.0488" x="155.244" y="201.7402">-&gt; minWageAck := 1 (BR-09)</text></g><ellipse cx="166.244" cy="57" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="CONFIRMED"><rect fill="#FFFFFF" height="50" rx="12.5" ry="12.5" style="stroke:#1C2230;stroke-width:0.5;" width="92.6621" x="119.744" y="320"/><line style="stroke:#1C2230;stroke-width:0.5;" x1="119.744" x2="212.4061" y1="342" y2="342"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="72.6621" x="129.744" y="334.2402">CONFIRMED</text></g><ellipse cx="166.244" cy="418" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="166.244" cy="418" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="28" data-uid="ent0003" id="entity_GMN2"><path d="M231.244,328 L231.244,341 L212.865,345 L231.244,349 L231.244,362 A0,0 0 0 0 231.244,362 L409.0115,362 A0,0 0 0 0 409.0115,362 L409.0115,338 L399.0115,328 L231.244,328 A0,0 0 0 0 231.244,328" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M399.0115,328 L399.0115,338 L409.0115,338 L399.0115,328" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="123.3926" x="237.244" y="342.2402">final state &#8212; read-only,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="156.7676" x="237.244" y="354.2402">not replaced by re-generation</text></g><g class="entity" data-entity="GMN5" data-source-line="29" data-uid="ent0006" id="entity_GMN5"><path d="M702.244,198 L702.244,256 L982.0057,256 L982.0057,208 L972.0057,198 L702.244,198" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><pat