<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1275px;height:418px;background:#FFFFFF;" width="1275px" height="418px" viewBox="0 0 1275 418" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="507.486" y="20.78" fill="#000" font-size="14" textLength="253.661" font-weight="700" font-family="'Helvetica'">Payroll.status state machine (spec §7)</text></g><g class="entity" data-qualified-name="DRAFT" id="ent0001" data-source-line="18"><rect x="344.5" y="135" width="415.49" height="92" fill="#FFF" style="stroke:#1C2230;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="344.5" y1="157" x2="759.99" y2="157" style="stroke:#1C2230;stroke-width:0.5;"/><text x="532.247" y="149.24" fill="#1C2230" font-size="12" textLength="39.996" font-family="'Helvetica'">DRAFT</text><text x="349.5" y="171.24" fill="#1C2230" font-size="12" textLength="234.082" font-family="'Helvetica'">every row with minWageWarning must have</text><text x="349.5" y="183.24" fill="#1C2230" font-size="12" textLength="317.127" font-family="'Helvetica'">minWageAck = 1 before Confirm is enabled (FR-16, BR-09)</text><text x="349.5" y="195.24" fill="#1C2230" font-size="12" textLength="246.117" font-family="'Helvetica'">internal: acknowledge minimum-wage warning</text><text x="349.5" y="207.24" fill="#1C2230" font-size="12" textLength="395.49" font-family="'Helvetica'">[row has minWageWarning] / acknowledgeMinWage(yearMonth, workerId)</text><text x="349.5" y="219.24" fill="#1C2230" font-size="12" textLength="154.049" font-family="'Helvetica'">-> minWageAck := 1 (BR-09)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0002" data-source-line="15"><ellipse cx="552" cy="57" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="CONFIRMED" id="ent0006" data-source-line="24"><rect x="505.5" y="291" width="92.662" height="50" fill="#FFF" style="stroke:#1C2230;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="505.5" y1="313" x2="598.162" y2="313" style="stroke:#1C2230;stroke-width:0.5;"/><text x="515.5" y="305.24" fill="#1C2230" font-size="12" textLength="72.662" font-family="'Helvetica'">CONFIRMED</text></g><g class="end_entity" data-qualified-name=".end." id="ent0008" data-source-line="26"><ellipse cx="552" cy="389" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="552" cy="389" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="28"><path d="M617,299 L617,312 L598.621,316 L617,320 L617,333 A0,0 0 0 0 617,333 L794.768,333 A0,0 0 0 0 794.768,333 L794.768,309 L784.768,299 L617,299 A0,0 0 0 0 617,299" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M784.768,299 L784.768,309 L794.768,309 L784.768,299" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="623" y="313.24" fill="#000" font-size="12" textLength="123.393" font-family="'Helvetica'">final state — read-only,</text><text x="623" y="325.24" fill="#000" font-size="12" textLength="156.768" font-family="'Helvetica'">not replaced by re-generation</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="29"><path d="M6,140 L6,222 A0,0 0 0 0 6,222 L325.84,222 A0,0 0 0 0 325.84,222 L325.84,185 L344.286,181 L325.84,177 L325.84,150 L315.84,140 L6,140 A0,0 0 0 0 6,140" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M315.84,140 L315.84,150 L325.84,150 L315.84,140" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="154.24" fill="#000" font-size="12" textLength="249.416" font-family="'Helvetica'">A3 System Clock only ever creates the DRAFT</text><text x="12" y="166.24" fill="#000" font-size="12" textLength="224.771" font-family="'Helvetica'">(runs at most once per month, BR-14) and</text><text x="12" y="178.24" fill="#000" font-size="12" textLength="258.762" font-family="'Helvetica'">notifies the owner (PAYROLL_DRAFT_READY);</text><text x="12" y="190.24" fill="#000" font-size="12" textLength="236.104" font-family="'Helvetica'">it never acknowledges warnings or confirms.</text><text x="12" y="202.24" fill="#000" font-size="12" textLength="298.84" font-family="'Helvetica'">Shared mode: the open client saves the draft; the server</text><text x="12" y="214.24" fill="#000" font-size="12" textLength="193.383" font-family="'Helvetica'">keeps CONFIRMED rows read-only.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk3" data-link-type="dependency"><polygon points="411.959,134.78,407.019,126.26,407.91,131.846,402.324,132.738,411.959,134.78" fill="#1C2230" style="stroke:#1C2230;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M541.816,60.354 C511.02,61.658 419.894,67.315 402,89 C387.266,106.855 390.452,119.195 407.91,131.846" style="stroke:#1C2230;stroke-width:1;" fill="none"/><text x="480.758" y="100.24" fill="#000" font-size="12" textLength="121.916" font-family="'Helvetica'">owner "Generate draft"</text><text x="404" y="112.24" fill="#000" font-size="12" textLength="275.432" font-family="'Helvetica'">generatePayroll(yearMonth) (UC-09, FR-15, BR-11)</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk4" data-link-type="dependency"><polygon points="669.873,134.866,679.458,132.604,673.853,131.84,674.617,126.235,669.873,134.866" fill="#1C2230" style="stroke:#1C2230;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M562.332,60.71 C590.247,62.865 666.085,70.36 681,89 C694.87,106.334 691.028,118.783 673.853,131.84" style="stroke:#1C2230;stroke-width:1;" fill="none"/><text x="690" y="100.24" fill="#000" font-size="12" textLength="220.102" font-family="'Helvetica'">[1st day of month, no rows for last month]</text><text x="692.684" y="112.24" fill="#000" font-size="12" textLength="214.734" font-family="'Helvetica'">prepareMonthlyPayroll() (UC-14, BR-14)</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk5" data-link-type="dependency"><polygon points="759.549,190.737,769.182,192.791,764.441,189.704,767.529,184.964,759.549,190.737" fill="#1C2230" style="stroke:#1C2230;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M759.549,171.263 C770.811,173.641 777.5,176.887 777.5,181 C777.5,185.113 775.703,187.326 764.441,189.704" style="stroke:#1C2230;stroke-width:1;" fill="none"/><text x="974.204" y="178.24" fill="#000" font-size="12" textLength="98.725" font-family="'Helvetica'">re-generate month</text><text x="779.5" y="190.24" fill="#000" font-size="12" textLength="488.133" font-family="'Helvetica'">[replaces DRAFT rows only, CONFIRMED rows kept] / generatePayroll(yearMonth) (UC-09)</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk7" data-link-type="dependency"><polygon points="552,290.934,556,281.934,552,285.934,548,281.934,552,290.934" fill="#1C2230" style="stroke:#1C2230;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M552,227.028 C552,248.43 552,268.156 552,285.934" style="stroke:#1C2230;stroke-width:1;" fill="none"/><text x="766.566" y="256.24" fill="#000" font-size="12" textLength="81.357" font-family="'Helvetica'">owner confirms</text><text x="554" y="268.24" fill="#000" font-size="12" textLength="506.49" font-family="'Helvetica'">[all minWageWarning rows have minWageAck = 1] / confirmPayroll(yearMonth) (UC-09, FR-15)</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" id="lnk9" data-link-type="dependency"><polygon points="552,377.947,556,368.947,552,372.947,548,368.947,552,377.947" fill="#1C2230" style="stroke:#1C2230;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M552,341.376 C552,353.778 552,363.242 552,372.947