e="stroke:#1C2230;stroke-width:0.5;"/><polygon fill="#1C2230" points="481.0684,72,487.0684,67,485.0684,72,487.0684,77,481.0684,72" style="stroke:#1C2230;stroke-width:1;"/></g><g class="participant participant-head" data-participant="SR"><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="66.0469" x="703.1074" y="109.2402">SubRequest</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="58.0254" x="707.1182" y="121.2402">(request 1)</text><ellipse cx="739.1309" cy="84" fill="#FFFFFF" rx="12" ry="12" style="stroke:#1C2230;stroke-width:0.5;"/><line style="stroke:#1C2230;stroke-width:0.5;" x1="727.1309" x2="751.1309" y1="98" y2="98"/></g><path d="M10,141 L73.6738,141 L73.6738,145 L63.6738,155 L10,155 L10,141" fill="#FFFFFF" style="stroke:#1C2230;stroke-width:1.5;"/><rect fill="none" height="198" style="stroke:#1C2230;stroke-width:1.5;" width="602.8008" x="10" y="141"/><text fill="#1C2230" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="18.6738" x="25" y="151.2402">par</text><text fill="#1C2230" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="306.7148" x="88.6738" y="152.2402">[Minho and Doyun press Accept at the same moment]</text><g class="message" data-participant-1="Minho" data-participant-2="Home"><polygon fill="#1C2230" points="284.9707,169,294.9707,173,284.9707,177,288.9707,173" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;" x1="53.0176" x2="290.9707" y1="173" y2="173"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="36.6855" x="60.0176" y="168.2402">Accept</text></g><g class="message" data-participant-1="Home" data-participant-2="Fn"><polygon fill="#1C2230" points="473.0684,195,483.0684,199,473.0684,203,477.0684,199" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;" x1="296.9707" x2="479.0684" y1="199" y2="199"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="162.0938" x="303.9707" y="194.2402">accept_sub_request(1, Minho)</text></g><g class="message" data-participant-1="Fn" data-participant-2="Fn"><line style="stroke:#1C2230;stroke-width:1;" x1="485.0684" x2="527.0684" y1="225" y2="225"/><line style="stroke:#1C2230;stroke-width:1;" x1="527.0684" x2="527.0684" y1="225" y2="238"/><line style="stroke:#1C2230;stroke-width:1;" x1="486.0684" x2="527.0684" y1="238" y2="238"/><polygon fill="#1C2230" points="496.0684,234,486.0684,238,496.0684,242,492.0684,238" style="stroke:#1C2230;stroke-width:1;"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="108.7324" x="492.0684" y="220.2402">begin transaction T1</text></g><line style="stroke:#1C2230;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="10" x2="612.8008" y1="247" y2="247"/><g class="message" data-participant-1="Doyun" data-participant-2="Home"><polygon fill="#1C2230" points="284.9707,262,294.9707,266,284.9707,270,288.9707,266" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;" x1="129.0527" x2="290.9707" y1="266" y2="266"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="36.6855" x="136.0527" y="261.2402">Accept</text></g><g class="message" data-participant-1="Home" data-participant-2="Fn"><polygon fill="#1C2230" points="473.0684,288,483.0684,292,473.0684,296,477.0684,292" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;" x1="296.9707" x2="479.0684" y1="292" y2="292"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="164.0977" x="303.9707" y="287.2402">accept_sub_request(1, Doyun)</text></g><g class="message" data-participant-1="Fn" data-participant-2="Fn"><line style="stroke:#1C2230;stroke-width:1;" x1="485.0684" x2="527.0684" y1="318" y2="318"/><line style="stroke:#1C2230;stroke-width:1;" x1="527.0684" x2="527.0684" y1="318" y2="331"/><line style="stroke:#1C2230;stroke-width:1;" x1="486.0684" x2="527.0684" y1="331" y2="331"/><polygon fill="#1C2230" points="496.0684,327,486.0684,331,496.0684,335,492.0684,331" style="stroke:#1C2230;stroke-width:1;"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="108.7324" x="492.0684" y="313.2402">begin transaction T2</text></g><g class="message" data-participant-1="Fn" data-participant-2="SR"><polygon fill="#1C2230" points="727.1309,384,737.1309,388,727.1309,392,731.1309,388" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;" x1="485.0684" x2="733.1309" y1="388" y2="388"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="229.0547" x="492.0684" y="359.2402">T1: UPDATE &#8230; SET status = ACCEPTED,</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="92.3848" x="492.0684" y="371.2402">acceptor = Minho</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="230.0625" x="492.0684" y="383.2402">WHERE id = 1 AND status = REQUESTED</text></g><g class="message" data-participant-1="SR" data-participant-2="Fn"><polygon fill="#1C2230" points="496.0684,410,486.0684,414,496.0684,418,492.0684,414" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="490.0684" x2="738.1309" y1="414" y2="414"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="190.7402" x="502.0684" y="409.2402">T1: 1 row (row locked until T1 ends)</text></g><g class="message" data-participant-1="Fn" data-participant-2="SR"><polygon fill="#1C2230" points="727.1309,460,737.1309,464,727.1309,468,731.1309,464" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;" x1="485.0684" x2="733.1309" y1="464" y2="464"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="229.0547" x="492.0684" y="435.2402">T2: UPDATE &#8230; SET status = ACCEPTED,</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="94.3887" x="492.0684" y="447.2402">acceptor = Doyun</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="230.0625" x="492.0684" y="459.2402">WHERE id = 1 AND status = REQUESTED</text></g><path d="M583,477 L583,499 L733,499 L733,487 L723,477 L583,477" fill="#FFFEF2" style="stroke:#1C2230;stroke-width:0.5;"/><path d="M723,477 L723,487 L733,487 L723,477" fill="#FFFEF2" style="stroke:#1C2230;stroke-width:0.5;"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="129.375" x="589" y="491.2402">T2 waits for the row lock</text><g class="message" data-participant-1="Fn" data-participant-2="Fn"><line style="stroke:#1C2230;stroke-width:1;" x1="485.0684" x2="527.0684" y1="534" y2="534"/><line style="stroke:#1C2230;stroke-width:1;" x1="527.0684" x2="527.0684" y1="534" y2="547"/><line style="stroke:#1C2230;stroke-width:1;" x1="486.0684" x2="527.0684" y1="547" y2="547"/><polygon fill="#1C2230" points="496.0684,543,486.0684,547,496.0684,551,492.0684,547" style="stroke:#1C2230;stroke-width:1;"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="142.7402" x="492.0684" y="517.2402">T1: close the other targets,</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="142.084" x="492.0684" y="529.2402">notify requester and owner</text></g><g class="message" data-participant-1="Fn" data-participant-2="SR"><polygon fill="#1C2230" points="727.1309,569,737.1309,573,727.1309,577,731.1309,573" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;" x1="485.0684" x2="733.1309" y1="573" y2="573"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="141.3691" x="492.0684" y="568.2402">T1: commit (lock released)</text></g><g class="message" data-participant-1="Fn" data-participant-2="Home"><polygon fill="#1C2230" points="307.9707,595,297.9707,599,307.9707,603,303.9707,599" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="301.9707" x2="484.0684" y1="599" y2="599"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="86.0156" x="313.9707" y="594.2402">T1: ACCEPTED</text></g><g class="message" data-participant-1="Home" data-participant-2="Minho"><polygon fill="#1C2230" points="64.0176,621,54.0176,625,64.0176,629,60.0176,625" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="58.0176" x2="295.9707" y1="625" y2="625"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="92.0625" x="70.0176" y="620.2402">request accepted</text></g><g class="message" data-participant-1="SR" data-participant-2="Fn"><polygon fill="#1C2230" points="496.0684,659,486.0684,663,496.0684,667,492.0684,663" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="490.0684" x2="738.1309" y1="663" y2="663"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="176.7363" x="502.0684" y="646.2402">T2: WHERE clause re-evaluated:</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="170.7129" x="502.0684" y="658.2402">status is ACCEPTED, so 0 rows</text></g><g class="message" data-participant-1="Fn" data-participant-2="Home"><polygon fill="#1C2230" points="307.9707,685,297.9707,689,307.9707,693,303.9707,689" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="301.9707" x2="484.0684" y1="689" y2="689"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="152.7188" x="313.9707" y="684.2402">T2: raise ALREADY_TAKEN</text></g><g class="message" data-participant-1="Home" data-participant-2="Doyun"><polygon fill="#1C2230" points="140.0527,711,130.0527,715,140.0527,719,136.0527,715" style="stroke:#1C2230;stroke-width:1;"/><line style="stroke:#1C2230;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="134.0527" x2="295.9707" y1="715" y2="715"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="143.918" x="146.0527" y="710.2402">"Choi Minho accepted first"</text></g><path d="M440,728 L440,786 L783,786 L783,738 L773,728 L440,728" fill="#FFFEF2" style="stroke:#1C2230;stroke-width:0.5;"/><path d="M773,728 L773,738 L783,738 L773,728" fill="#FFFEF2" style="stroke:#1C2230;stroke-width:0.5;"/><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="322.1016" x="446" y="742.2402">PostgreSQL, READ COMMITTED: a second UPDATE of the</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="264.082" x="446" y="754.2402">same row waits until the first transaction commits,</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="301.4414" x="446" y="766.2402">then re-checks its WHERE clause on the committed row.</text><text fill="#1C2230" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="221.4668" x="446" y="778.2402">Exactly one acceptance changes the row.</text><!--SRC=[fLNRQXin47tNLmpR5mViadNfYo65hRrkIfCqjHrA8H1axTWMNakkfCsbfT2lwOVrIpfQxIRhP4rlVZ1OSsRcwCmPsQwbsdB3Dv3XWXUv6slbplW68Jh6_1gT53nYjWqrbLyGudvxSAXpRU1PFEptNnms87R5CtqZrH8MFBVOYCovM2-DBbHMvOxBJmEH6ADlzXR6pmKgWILejf9YhT1QY5iWfnJWIqnokLIGuyArOE0h0pYH2poH2bzhaw7PxTo8xY4ESCuDwIUtNBds4at0tYg9SDgqvuVGtimtTBfjpmoXlPaZUIqfgottMtDcFfURkrA